name: Go tests
on:
  push:
    branches: [master, main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/fritzbox_exporter .
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
