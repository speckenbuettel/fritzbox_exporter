name: DockerHub ARM64

on:
  push:
    tags: ['api-v0-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - run: go test -race ./...
      - run: go vet ./...

  publish:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select image tag
        id: image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="sha-${COMMIT}"
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          echo "name=senecaiii/fritzbox_exporter:${tag}" >> "$GITHUB_OUTPUT"
      - name: Build ARM64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}
          build-args: REPO=${{ github.repository }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = arm64
          docker run --rm "$IMAGE" -help 2>&1 | tee /tmp/exporter-help.txt
          grep -q api-metrics-file /tmp/exporter-help.txt
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -s /app/metrics-api.json && test -s /app/metrics-lua.json && test -s /app/metrics.json'
      - name: Smoke test SQLite archive on ARM64
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          trap 'docker rm -f archive-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name archive-smoke -e ARCHIVE_FILE=/data/events.db -e ARCHIVE_TOKEN=ci-smoke-test-token -e GATEWAY_URL=http://127.0.0.1:9 -e GATEWAY_LUAURL=http://127.0.0.1 "$IMAGE"
          for attempt in $(seq 1 15); do
            if docker exec archive-smoke wget -qO- --header='Authorization: Bearer ci-smoke-test-token' http://127.0.0.1:9042/api/events > /tmp/archive.json; then break; fi
            sleep 1
          done
          grep -q '"events"' /tmp/archive.json
          docker exec archive-smoke test -s /data/events.db
          docker stop -t 70 archive-smoke
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$IMAGE"
      - name: Inspect published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker buildx imagetools inspect "$IMAGE"
